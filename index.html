<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Admission Form</title>
    <!-- MDB CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
      rel="stylesheet"
    />
    <style>
      html, body {
        height: 100%; /* Ensure html and body take full height */
        margin: 0; /* Remove default margin */
      }
      .background-radial-gradient {
        height: 100%;
        background: url('bg_ed.jpg') no-repeat center center; /* Replace with your background image URL */
        background-size: cover; /* Ensure image covers the entire background */
        background-color: hsl(218, 41%, 15%);
        background-blend-mode: overlay; /* Blend the radial gradient with the background image */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative; /* Keep elements centered */
      }

      #radius-shape-1 {
        height: 220px;
        width: 220px;
        top: -60px;
        left: -130px;
        background: radial-gradient(#44006b, #ad1fff);
        overflow: hidden;
      }

      #radius-shape-2 {
        border-radius: 38% 62% 63% 37% / 70% 33% 67% 30%;
        bottom: -60px;
        right: -110px;
        width: 300px;
        height: 300px;
        background: radial-gradient(#44006b, #ad1fff);
        overflow: hidden;
      }

      .bg-glass {
        background-color: hsla(0, 0%, 100%, 0.9) !important;
        backdrop-filter: saturate(200%) blur(25px);
      }

       /* New styles for header */
      .header {
        position: absolute; /* Position the header absolutely */
        top: 0;
        left: 0;
        
        padding: 20px; /* Add some padding */
        display: flex; /* Use flexbox for alignment */
        align-items: center; /* Center items vertically */
        justify-content: center; /* Center items horizontally */
        
        z-index: 10; /* Ensure it stays above other content */
      }

      .header img {
        height: 70px; /* Set logo height */
        margin-right: 10px; /* Spacing between logo and text */
      }

      .header h1 {
        font-size: 2rem; /* Adjust font size */
        margin: 0; /* Remove default margin */
        color: hsl(218, 81%, 95%); /* Set text color */
        text-align: left; /* Align text to the left */
      }
    </style>
  </head>
  <body>

    <!-- Header Section -->
    <header class="header">
      <img src="LOGO_FINAL.png" alt="Onelogica Logo" /> <!-- Replace with your logo image -->
      <h1>
        Onelogica<br />
        University
      </h1>
    </header>
    <!-- Section: Design Block -->
    <section class="background-radial-gradient overflow-hidden">
      <div class="container px-4 py-5 px-md-5 text-center text-lg-start my-5">
        <div class="row gx-lg-5 align-items-center mb-5">
          <div class="col-lg-6 mb-5 mb-lg-0" style="z-index: 10">
            <h1 class="my-5 display-5 fw-bold ls-tight" style="color: hsl(218, 81%, 95%)">
              Admission Form <br />
              <span style="color: hsl(218, 81%, 75%)">for your future!</span>
            </h1>
            <p class="mb-4 opacity-70" style="color: hsl(218, 81%, 85%)">
              Apply to your preferred educational institution with ease. Please fill in your details below and take the first step towards your future.
            </p>
          </div>

          <div class="col-lg-6 mb-5 mb-lg-0 position-relative">
            <div id="radius-shape-1" class="position-absolute rounded-circle shadow-5-strong"></div>
            <div id="radius-shape-2" class="position-absolute shadow-5-strong"></div>

            <div class="card bg-glass">
              <div class="card-body px-4 py-5 px-md-5">
                <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DGC000005prf7" method="POST">
                  <!-- 2 column grid layout with text inputs for the first and last names -->
                  <div class="row">
                    <div class="col-md-6 mb-4">
                      <div data-mdb-input-init class="form-outline">
                        <input type="hidden" name="oid" value="00DGC000005prf7">
                        <input type=hidden name="retURL" value="https://ephemeral-gingersnap-faf859.netlify.app/">

                        <input id="first_name" maxlength="40" name="first_name" class="form-control" size="20" type="text" required pattern="[A-Za-z\s]+" title="First name can only contain letters." />
                        <label for="first_name" class="form-label">First Name</label>
                      </div>
                    </div>
                    <div class="col-md-6 mb-4">
                      <div data-mdb-input-init class="form-outline">
                        <input id="last_name" class="form-control" maxlength="80" name="last_name" size="20" type="text" required pattern="[A-Za-z\s]+" title="Last name can only contain letters." />
                        <label for="last_name" class="form-label">Last Name</label>
                      </div>
                    </div>
                  </div>

                  <!-- <div data-mdb-input-init class="form-outline">
                        <input id="title" class="form-control" maxlength="80" name="title" size="20" type="text" required />
                        <label for="title" class="form-label">Title</label>
                      </div> -->

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="mobile" maxlength="80" class="form-control" name="mobile" size="20" type="tel" required pattern="^\d{10,15}$" title="Mobile number must be between 10 to 15 digits." />
                    <label for="mobile" class="form-label">Mobile</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="email" maxlength="80" class="form-control" name="email" size="20" type="email" required />
                    <label for="email" class="form-label">Email</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="00NGC00000a0xeW" maxlength="40" class="form-control" name="00NGC00000a0xeW" size="20" type="text" required />
                    <label class="form-label" for="00NGC00000a0xeW">School/College</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="00NGC00000a0xcG" maxlength="40" class="form-control" name="00NGC00000a0xcG" size="20" type="number" required min="0" max="100" />
                    <label class="form-label" for="00NGC00000a0xcG">10th Score</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="00NGC00000a0xcL" maxlength="40" class="form-control" name="00NGC00000a0xcL" size="20" type="number" required min="0" max="100" />
                    <label class="form-label" for="00NGC00000a0xcL">12th Score</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="city" maxlength="40" class="form-control" name="city" size="20" type="text" required />
                    <label for="city" class="form-label">City</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="state" maxlength="20" class="form-control" name="state" size="20" type="text" required />
                    <label for="state" class="form-label">State/Province</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4">
                    <input id="00NGC00000a0xcB" maxlength="40" class="form-control" name="00NGC00000a0xcB" size="20" type="text" required />
                    <label class="form-label" for="00NGC00000a0xcB">Course Interested</label>
                  </div>

                  <div data-mdb-input-init class="form-outline mb-4" style="display: none;">
                    <input id="lead_source" maxlength="40" class="form-control" name="lead_source" size="20" type="text" value="Web" />
                    <label class="form-label" for="lead_source">Lead Status</label>
                  </div>

                  <input type="submit" name="submit" value="Submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-block mb-4">
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Section: Design Block -->

    <!-- MDB JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
  </body>
</html>
